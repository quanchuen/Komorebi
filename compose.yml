# `docker compose up --build` starts the full application: api + web (built from
# this repo) and the martin + valhalla adapters. Only `plateau_shadow` sits
# behind a profile because it is a one-shot pipeline, not a long-running service.
#
# Postgres is NOT part of this file — bring your own (see README) and point
# db.env at it. Migrations are applied by the `migrate` one-shot service before
# the api and martin start, so a fresh checkout is schema-complete on first up.
#
# `make watch` runs the same stack under `docker compose watch` (see the
# `develop` blocks): web gets Vite HMR via file sync, api is rebuilt on commit.
#
# This file builds local images only. Published ghcr.io images are defined in
# docker-bake.hcl (`make image-build` / `make image-push`).
services:
  migrate:
    image: migrate/migrate:v4.18.3
    env_file:
      - db.env
    volumes:
      - ./migrations:/migrations:ro
    # The image ENTRYPOINT is the `migrate` binary, which cannot expand
    # $DATABASE_URL itself; go through sh so the env_file value is used.
    entrypoint: ["sh", "-c"]
    command: ['exec migrate -path /migrations -database "$$DATABASE_URL" up']

  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    env_file:
      - db.env
      # Optional: WEATHER_PROVIDER / WEATHER_API_KEY / ANTHROPIC_API_KEY.
      # See weather.env.example; without it the API uses open-meteo.
      - path: weather.env
        required: false
    environment:
      VALHALLA_URL: http://valhalla:8002
      # Local-only default, the same dev secret the Makefile injects for
      # `make dev-run` / `make dev-api`. Export JWT_SECRET to override it.
      JWT_SECRET: ${JWT_SECRET:-cyclist-map-dev-secret-do-not-use-in-production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    develop:
      watch:
        # Deliberately NOT watching ./api: a rebuild per file save would
        # restart the API mid-edit. The image is rebuilt only when this stamp
        # is touched — by the git hooks in web/.husky (commit, merge or branch
        # switch that changes non-test files under api/) or `make api-rebuild`.
        - action: rebuild
          path: ./.watch/api.rebuild

  martin:
    image: ghcr.io/maplibre/martin:1.13.0
    ports:
      - "3000:3000"
    env_file:
      - db.env
    volumes:
      - ./martin.yaml:/usr/local/share/martin/martin.yaml:ro
    command: ["--config", "/usr/local/share/martin/martin.yaml"]
    # martin.yaml references SQL function sources created by migrations
    # (e.g. environment.shadow_cells); Martin only discovers them at startup.
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf
      # Download SRTM elevation for the graph extent and rebuild tiles with it —
      # required for /height (elevation profiles, gain/loss backfill).
      build_elevation: "True"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # `runtime` is the production adapter-node server; `dev` is the Vite dev
      # server the watch rules below need (`make watch` sets WEB_TARGET=dev).
      # NODE_ENV comes from the selected stage.
      target: ${WEB_TARGET:-runtime}
    ports:
      - "3001:3001"
    environment:
      - ORIGIN=http://localhost:3001
      # Server-side proxy targets (see web/src/hooks.server.ts). WEB_API_URL
      # lets `make dev-api` point the container at an API running on the host.
      - API_URL=${WEB_API_URL:-http://api:8080}
      - TILES_URL=http://martin:3000
      # Vite dev-server proxy targets (dev target only; see web/vite.config.ts).
      - API_PROXY_TARGET=${WEB_API_URL:-http://api:8080}
      - TILES_PROXY_TARGET=http://martin:3000
      # CARTO basemap key (browser-side; free at carto.com/basemaps/apikey).
      # Interpolated from the host shell or a root .env file; never commit it.
      - PUBLIC_CARTO_API_KEY=${PUBLIC_CARTO_API_KEY:-}
    # host.docker.internal resolves natively on Docker Desktop; this maps it on
    # Linux too (needed when WEB_API_URL points at a host process).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped
    develop:
      # Effective with the `dev` target only: synced files land in the running
      # Vite server, which hot-reloads them. The runtime image serves a
      # prebuilt bundle and ignores them.
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: sync
          path: ./web/static
          target: /app/static
        - action: sync+restart
          path: ./web/vite.config.ts
          target: /app/vite.config.ts
        - action: sync+restart
          path: ./web/svelte.config.js
          target: /app/svelte.config.js
        - action: sync+restart
          path: ./web/tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./web/package-lock.json

  plateau_shadow:
    build:
      context: ./pipelines/plateau_shadow
      dockerfile: Dockerfile
    env_file:
      - db.env
    profiles:
      - pipelines
    volumes:
      # Cache downloaded/extracted CityGML across runs (--rm containers).
      - ./pipelines/plateau_shadow/data:/app/data
    # The image ENTRYPOINT is ["python", "pipeline.py"]; pass flags only.
    command: >
      --wards chiyoda,minato,shibuya
      --months 1,4,7,10

volumes:
  valhalla_tiles:
