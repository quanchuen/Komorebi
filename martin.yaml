# martin.yaml — Vector tile sources for komorebi
# Martin v1.x config format

postgres:
  # Env-substituted (must stay unquoted for Martin to expand it) so one file
  # serves both the native binary (localhost default) and the compose service
  # (DATABASE_URL from db.env, which points at host.docker.internal).
  connection_string: ${DATABASE_URL:-postgres://osm_dev:osm_dev@localhost:5432/cyclist_map_dev?sslmode=disable}
  auto_publish: false
  tables:
    osm_roads:
      schema: osm
      table: roads
      srid: 4326
      geometry_column: geom
      geometry_type: LINESTRING
      minzoom: 8
      maxzoom: 18
      properties:
        name: text
        highway: text
        cycleway: text
        surface: text
        bicycle: text

    osm_landuse:
      schema: osm
      table: landuse
      srid: 4326
      geometry_column: geom
      geometry_type: GEOMETRY
      minzoom: 10
      maxzoom: 18
      properties:
        name: text
        landuse: text
        leisure: text

    routes:
      schema: routes
      table: route
      srid: 4326
      geometry_column: geometry
      geometry_type: LINESTRING
      minzoom: 8
      maxzoom: 18
      properties:
        id: uuid
        name: text
        difficulty: text
        status: text
        distance_m: float8

    venues:
      schema: environment
      table: venue
      srid: 4326
      geometry_column: geometry
      geometry_type: POINT
      minzoom: 12
      maxzoom: 18
      properties:
        name: text
        category: text
        brand: text

    traffic_signals:
      schema: environment
      table: traffic_signal
      srid: 4326
      geometry_column: geometry
      geometry_type: POINT
      minzoom: 14
      maxzoom: 18

  functions:
    # Time-sliced building shadows; pass ?hour_slot=0-23&month=1-12 (JST).
    shadow_cells:
      schema: environment
      function: shadow_cells
      minzoom: 11
      maxzoom: 16
