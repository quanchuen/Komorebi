name: images

# Push on demand only: run this workflow manually and pick the branch.
# main/master publish signed images to ghcr.io/<owner>/komorebi/release/*,
# any other branch publishes to .../develop/*. The build itself is owned by
# the Makefile + docker-bake.hcl; this workflow only provides the tooling.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless cosign signing (Sigstore OIDC) for release images.
  id-token: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed for `git describe` (image version).
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3

      - name: Build, push and sign
        env:
          GIT_BRANCH: ${{ github.ref_name }}
        run: make image-push
